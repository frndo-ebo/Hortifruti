<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verde e Grão - Empório</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  
  <body>
    <!-- HEADER -->
    <header class="padrao">
      <div class="header-container">
        <div class="logo-info">
          <h1>Verde e Grão <span>Empório</span></h1>
          <p>Ofertas frescas do dia &#127813;</p>
        </div>
        
        <nav class="nav-links">
          <a href="login.html" class="nav-item">
            Login <i class="fa-solid fa-user"></i>
          </a>
        </nav>
      </div>
        <nav class="nav-links">
          <a href="carrinho.html" class="nav-item" title="Meu Carrinho">
             🛒 Carrinho
          </a>
        </nav>
    </header>
    

    <!-- MAIN -->
    <main class="container-hortifruti">
      
      <!-- BARRA DE BUSCA -->
      <div class="busca-container">
        <input 
          type="text" 
          id="busca-input" 
          class="busca-input" 
          placeholder="🔍 Buscar produto (Maçã, Tomate, Alecrim...)"
          autocomplete="off"
        />
      </div>

      <!-- SEÇÃO: FRUTAS -->
      <section class="categoria-hortifruti">
        <h2>Frutas</h2>
        <div class="container-carrossel">
          <div class="carrossel-pista-container">
            <div class="carrossel-pista" id="container-frutas">
              <!-- Renderizado dinamicamente por script.js -->
            </div>
          </div>
        </div>
      </section>

      <!-- SEÇÃO: LEGUMES -->
      <section class="categoria-hortifruti">
        <h2>Legumes</h2>
        <div class="container-carrossel">
          <div class="carrossel-pista-container">
            <div class="carrossel-pista" id="container-legumes">
              <!-- Renderizado dinamicamente por script.js -->
            </div>
          </div>
        </div>
      </section>

      <!-- SEÇÃO: VERDURAS E TEMPEROS -->
      <section class="categoria-hortifruti">
        <h2>Verduras e Temperos</h2>
        <div class="container-carrossel">
          <div class="carrossel-pista-container">
            <div class="carrossel-pista" id="container-temperos">
              <!-- Renderizado dinamicamente por script.js -->
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- SCRIPT ES6 MODULE -->
    <script src="carrinho.js"></script>
    <script type="module" src="script-novo.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
